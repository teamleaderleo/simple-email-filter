name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unit-tests.log
      - name: Upload failing test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-${{ matrix.python-version }}-failure
          path: unit-tests.log
      - run: python -m compileall -q email_filter handlers webhook_handler.py mailbox_cleanup.py mailbox_export.py junk_backfill.py setup_webhook.py setup_token_interactive.py
      - run: bash -n scripts/email-filter.sh scripts/lambda-deploy.sh scripts/mailbox-cleanup.sh scripts/mailbox-apply-stage-all.sh scripts/mailbox-ops.sh scripts/mailbox-export.sh scripts/junk-backfill.sh scripts/test.sh
